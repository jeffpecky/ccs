name: Bar Release

# Build and publish macOS and Windows CCS Bar assets to floating
# `ccs-bar-latest` release (what `ccs bar install` downloads).
#
# Scoped deliberately so it NEVER burdens other PRs or CI:
#   - Triggers ONLY on push to `main` that changes `macos-bar/**`, or a manual
#     run from `main`. Regular PRs, dev pushes, and non-bar changes do not start it.
#   - Runs ONLY on the dedicated self-hosted macOS runner (label `ccs-bar` on
#     kai-minim4). The Linux CI runners never match this job, and this job never
#     competes for them.
#
# Version source: `macos-bar/VERSION` (single line semver). Bump it in the same
# PR when you want a new number; the asset is always "latest" regardless.

on:
  push:
    branches: [main]
    paths:
      - 'macos-bar/**'
      - 'windows-bar/**'
      - 'src/commands/bar/**'
  workflow_dispatch:

# Least privilege: only the release-asset write the publish step needs.
permissions:
  contents: write

# One release at a time; never cancel a publish midway.
concurrency:
  group: bar-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish CCS Bar
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macos, ccs-bar]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Read bar version
        id: ver
        run: |
          version="$(tr -d '[:space:]' < macos-bar/VERSION)"
          if [ -z "$version" ]; then
            echo "::error file=macos-bar/VERSION::macos-bar/VERSION is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "[i] CCS Bar version: $version"

      - name: Build and package CCS Bar.app
        working-directory: macos-bar
        run: ./Scripts/package_app.sh "${{ steps.ver.outputs.version }}"

      - name: Run CCS Bar checks
        working-directory: macos-bar
        run: swift run ccs-bar-check

      - name: Publish to ccs-bar-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # gh lives in Homebrew on the self-hosted runner; ensure it is on PATH.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! gh release view ccs-bar-latest --repo jeffpecky/ccs >/dev/null 2>&1; then
            gh release create ccs-bar-latest --repo jeffpecky/ccs --target "$GITHUB_SHA" --title "CCS Bar v${VERSION}" --notes "CCS Bar floating release"
          fi
          gh release upload ccs-bar-latest macos-bar/dist/CCS-Bar.app.zip --repo jeffpecky/ccs --clobber
          printf '%s\n' "${VERSION}" > version.txt
          gh release upload ccs-bar-latest version.txt --repo jeffpecky/ccs --clobber
          echo "[OK] Published version.txt (${VERSION}) to ccs-bar-latest"
          rm -f version.txt
          notes="$(mktemp)"
          cat > "$notes" <<NOTES
          CCS Bar v${VERSION}

          Install or update: ccs bar install
          Ad-hoc signed: first launch may need right-click then Open.

          Built automatically from main when macos-bar changes.
          NOTES
          gh release edit ccs-bar-latest --repo jeffpecky/ccs --target "$GITHUB_SHA" --title "CCS Bar v${VERSION}" --notes-file "$notes"
          rm -f "$notes"
          echo "[OK] Published CCS Bar v${VERSION} to ccs-bar-latest"

  windows:
    name: Build Windows CCS Bar
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Windows Bar
        run: dotnet test windows-bar/CCSBar.sln -c Release
      - name: Package self-contained win-x64 asset
        shell: pwsh
        run: ./windows-bar/Scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ccs-bar-windows-x64
          path: |
            windows-bar/dist/CCS-Bar-windows-x64.zip
            windows-bar/dist/CCS-Bar-windows-x64.zip.sha256
      - name: Publish Windows assets to ccs-bar-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view ccs-bar-latest --repo jeffpecky/ccs 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ccs-bar-latest --repo jeffpecky/ccs --target $env:GITHUB_SHA --title 'CCS Bar' --notes 'CCS Bar floating release'
            if ($LASTEXITCODE -ne 0) { gh release view ccs-bar-latest --repo jeffpecky/ccs | Out-Null }
          }
          gh release upload ccs-bar-latest windows-bar/dist/CCS-Bar-windows-x64.zip windows-bar/dist/CCS-Bar-windows-x64.zip.sha256 --repo jeffpecky/ccs --clobber
