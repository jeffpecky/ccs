name: Bar Release

# Build and publish macOS and Windows CCS Bar assets to the floating
# `ccs-bar-latest` release (what `ccs bar install` downloads).
#
# Scoped deliberately so it NEVER burdens other PRs or CI:
#   - Triggers ONLY on push to `main` that changes `macos-bar/**`,
#     `windows-bar/**`, or a manual run from `main`. Regular PRs, dev pushes,
#     and non-bar changes do not start it.
#   - macOS build runs on GitHub-hosted `macos-latest`, Windows build on
#     `windows-latest`, publish on `ubuntu-latest`. The Linux CI runners used
#     by PR CI never match these jobs.
#
# Atomicity: `ccs-bar-latest` is only touched by the publish job, which runs
# after BOTH platform jobs pass. The floating release therefore never holds
# assets from mismatched commits, and a single-platform failure leaves the
# previous complete release intact.
#
# Version source: `macos-bar/VERSION` (single line semver). Bump it in the same
# PR when you want a new number; the asset is always "latest" regardless.

on:
  push:
    branches: [main]
    paths:
      - 'macos-bar/**'
      - 'windows-bar/**'
  workflow_dispatch:

# Least privilege: only the release-asset write the publish step needs.
permissions:
  contents: write

# One release at a time; never cancel a publish midway.
concurrency:
  group: bar-release
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS CCS Bar
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read bar version
        id: ver
        run: |
          version="$(tr -d '[:space:]' < macos-bar/VERSION)"
          if [ -z "$version" ]; then
            echo "::error file=macos-bar/VERSION::macos-bar/VERSION is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "[i] CCS Bar version: $version"

      - name: Run CCS Bar checks
        working-directory: macos-bar
        run: swift run ccs-bar-check

      - name: Build and package CCS Bar.app
        working-directory: macos-bar
        run: ./Scripts/package_app.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ccs-bar-macos
          path: macos-bar/dist/CCS-Bar.app.zip
          if-no-files-found: error

  windows:
    name: Build Windows CCS Bar
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read bar version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'macos-bar/VERSION' -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "macos-bar/VERSION is empty"
            exit 1
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "[i] CCS Bar version: $version"

      - name: Test Windows Bar
        run: dotnet test windows-bar/CCSBar.sln -c Release

      - name: Package self-contained win-x64 asset
        shell: pwsh
        run: ./windows-bar/Scripts/package.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ccs-bar-windows-x64
          path: |
            windows-bar/dist/CCS-Bar-windows-x64.zip
            windows-bar/dist/CCS-Bar-windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish complete CCS Bar release
    needs: [macos, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage metadata and update floating release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < macos-bar/VERSION)"
          printf '{"version":"%s","sha":"%s","assets":["CCS-Bar.app.zip","CCS-Bar-windows-x64.zip","CCS-Bar-windows-x64.zip.sha256"]}\n' \
            "$VERSION" "${GITHUB_SHA}" > artifacts/release-metadata.json
          printf '%s\n' "$VERSION" > artifacts/version.txt

          notes="$(mktemp)"
          cat > "$notes" <<NOTES
          CCS Bar v${VERSION}

          Install or update: ccs bar install

          - macOS: CCS-Bar.app.zip (ad-hoc signed: first launch may need right-click then Open)
          - Windows: CCS-Bar-windows-x64.zip (x64 self-contained .NET 8) + SHA-256 checksum

          Built automatically from main (${GITHUB_SHA}) when macos-bar or windows-bar changes.
          Both platform builds must pass before this floating release moves.
          NOTES

          # Snapshot current assets first so a failed publish can be rolled back.
          BACKUP="ccs-bar-rollback-${GITHUB_SHA}"
          mkdir -p "$BACKUP"
          restore_backup() {
            echo "::error::Publish failed - restoring previous ccs-bar-latest assets"
            if [ -n "$(find "$BACKUP" -type f -print -quit)" ]; then
              gh release upload ccs-bar-latest "$BACKUP"/* --clobber || true
            fi
          }

          if gh release view ccs-bar-latest >/dev/null 2>&1; then
            gh release download ccs-bar-latest --dir "$BACKUP" || true
            trap restore_backup ERR
            gh release upload ccs-bar-latest artifacts/* --clobber
            gh release edit ccs-bar-latest \
              --target "${GITHUB_SHA}" \
              --title "CCS Bar v${VERSION}" \
              --notes-file "$notes"
            trap - ERR
          else
            gh release create ccs-bar-latest \
              --target "${GITHUB_SHA}" \
              --title "CCS Bar v${VERSION}" \
              --notes-file "$notes" \
              artifacts/*
          fi
          rm -f "$notes"
          echo "[OK] Published complete CCS Bar v${VERSION} to ccs-bar-latest"
