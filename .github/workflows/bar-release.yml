name: Bar Release

# Build and publish macOS and Windows CCS Bar assets to floating
# `ccs-bar-latest` release (what `ccs bar install` downloads).
#
# Scoped deliberately so it NEVER burdens other PRs or CI:
#   - Triggers ONLY on push to `main` that changes `macos-bar/**`, or a manual
#     run from `main`. Regular PRs, dev pushes, and non-bar changes do not start it.
#   - Runs ONLY on the dedicated self-hosted macOS runner (label `ccs-bar` on
#     kai-minim4). The Linux CI runners never match this job, and this job never
#     competes for them.
#
# Version source: `macos-bar/VERSION` (single line semver). Bump it in the same
# PR when you want a new number; the asset is always "latest" regardless.

on:
  push:
    branches: [main]
    paths:
      - 'macos-bar/**'
      - 'windows-bar/**'
      - 'src/commands/bar/**'
  workflow_dispatch:

# Least privilege: only the release-asset write the publish step needs.
permissions:
  contents: write

# One release at a time; never cancel a publish midway.
concurrency:
  group: bar-release
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS CCS Bar
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macos, ccs-bar]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read bar version
        id: ver
        run: |
          version="$(tr -d '[:space:]' < macos-bar/VERSION)"
          if [ -z "$version" ]; then
            echo "::error file=macos-bar/VERSION::macos-bar/VERSION is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "[i] CCS Bar version: $version"

      - name: Build and package CCS Bar.app
        working-directory: macos-bar
        run: ./Scripts/package_app.sh "${{ steps.ver.outputs.version }}"

      - name: Run CCS Bar checks
        working-directory: macos-bar
        run: swift run ccs-bar-check

      - uses: actions/upload-artifact@v4
        with:
          name: ccs-bar-macos
          path: macos-bar/dist/CCS-Bar.app.zip

  windows:
    name: Build Windows CCS Bar
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Windows Bar
        run: dotnet test windows-bar/CCSBar.sln -c Release
      - name: Package self-contained win-x64 asset
        shell: pwsh
        run: ./windows-bar/Scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ccs-bar-windows-x64
          path: |
            windows-bar/dist/CCS-Bar-windows-x64.zip
            windows-bar/dist/CCS-Bar-windows-x64.zip.sha256
  publish:
    name: Publish complete CCS Bar release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage metadata and update floating release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < macos-bar/VERSION)"
          printf '{"version":"%s","sha":"%s","assets":["CCS-Bar.app.zip","CCS-Bar-windows-x64.zip","CCS-Bar-windows-x64.zip.sha256"]}\n' "$VERSION" "${{ github.sha }}" > artifacts/release-metadata.json
          printf '%s\n' "$VERSION" > artifacts/version.txt
          STAGE="ccs-bar-${{ github.sha }}"
          gh release create "$STAGE" --repo jeffpecky/ccs --target "${{ github.sha }}" --title "CCS Bar v$VERSION" --notes "Staged complete platform release for ${{ github.sha }}"
          gh release upload "$STAGE" artifacts/* --repo jeffpecky/ccs
          BACKUP="ccs-bar-rollback-${{ github.sha }}"
          mkdir "$BACKUP"
          rollback() {
            if [ -n "$(find "$BACKUP" -type f -print -quit)" ]; then
              gh release upload ccs-bar-latest "$BACKUP"/* --repo jeffpecky/ccs --clobber
            fi
          }
          if gh release view ccs-bar-latest --repo jeffpecky/ccs >/dev/null 2>&1; then
            gh release download ccs-bar-latest --repo jeffpecky/ccs --dir "$BACKUP"
            trap rollback ERR
            gh release upload ccs-bar-latest artifacts/* --repo jeffpecky/ccs --clobber
            gh release edit ccs-bar-latest --repo jeffpecky/ccs --target "${{ github.sha }}" --title "CCS Bar v$VERSION" --notes "Complete macOS and Windows release built from ${{ github.sha }}"
            trap - ERR
          else
            gh release create ccs-bar-latest --repo jeffpecky/ccs --target "${{ github.sha }}" --title "CCS Bar v$VERSION" --notes "Complete macOS and Windows release built from ${{ github.sha }}" artifacts/*
          fi
